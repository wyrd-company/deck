name: Publish to wyrd.foo

# A successful Release run from a pushed release tag publishes docs, and an
# operator can publish docs alone (for example a deck-docs@X.Y.Z tag after a
# docs-only release) with a manual run that names the source ref. A main-branch
# push, a pull request and a docs tag push publish nothing by themselves. The
# Release workflow is tag-only; following it lets wyrd.foo read its completed
# GitHub Release.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit of deck to publish docs from, such as deck-docs@0.1.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2
    with:
      ref: ${{ inputs.ref || github.event.workflow_run.head_branch }}
    secrets: inherit
