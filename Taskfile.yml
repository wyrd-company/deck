version: "3"

vars:
  VERSION: '{{.VERSION | default "dev"}}'
  LDFLAGS: -s -w -X main.Version={{.VERSION}}
  ACTIONLINT: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
  format:
    desc: Format Go sources
    cmds:
      - gofmt -w .
  format:check:
    desc: Check Go formatting
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
  lint:
    desc: Vet and check formatting
    deps: [vet, format:check]
  test:
    desc: Run tests (OpenBao tests skip without bao)
    cmds:
      - go test ./...
  test:ci:
    desc: Run uncached tests and fail when OpenBao tests skip
    cmds:
      - bash scripts/test-ci.sh
  ci:
    desc: Run repository checks with mandatory real OpenBao coverage
    cmds:
      - task: check
        vars:
          TEST_TASK: test:ci
  build:
    desc: Build deck into bin/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/deck ./cmd/deck
  workflows:check:
    desc: Validate GitHub Actions workflows
    cmds:
      - '{{.ACTIONLINT}}'
      - python3 scripts/check-ci-go.py
  intentional:check:
    desc: Validate intentional configuration and intents
    cmds:
      - |
        if [ -n "$(git tag --list '[0-9]*.[0-9]*.[0-9]*')" ]; then
          intentional check
        else
          intentional status
        fi
  generate:
    desc: Generate Go protobuf and gRPC code with pinned tools
    cmds:
      - bash scripts/generate.sh
  generate:check:
    desc: Fail when generated API code differs from the design proto
    cmds:
      - bash scripts/check-generated.sh
  docs:check:
    desc: Validate design documents, schemas, fixtures and proto
    cmds:
      - bash docs/check.sh
  config:check:
    desc: Validate both annotated example configs without network access
    cmds:
      - go run ./cmd/deck config validate --config docs/specifications/assets/configuration/examples/client.yml
      - go run ./cmd/deck service validate --config docs/specifications/assets/configuration/examples/service.yml
  guards:check:
    desc: Prove validation, Vault and check-task guards with restored mutations
    cmds:
      - python3 scripts/prove-guards.py --integration
  transport:guards:check:
    desc: Prove transport authentication and carried Vault guards
    cmds:
      - python3 scripts/prove-transport-guards.py
  service:guards:check:
    desc: Prove service routing, send-outcome and publication guards with restored mutations
    cmds:
      - python3 scripts/prove-service-guards.py
  test:discord:live:
    desc: Run opt-in API tests against the configured test Discord server
    cmds:
      - go test -count=1 -tags discordlive -run '^TestDiscordLive$' -v ./internal/service
  config:home:check:
    desc: Prove passwd-home lookup with the real CLI in bubblewrap (Linux)
    cmds:
      - bash scripts/prove-config-home.sh
  check:
    desc: Run all repository checks
    deps:
      - lint
      - build
      - generate:check
      - docs:check
      - config:check
      - workflows:check
      - intentional:check
      - task: '{{default "test" .TEST_TASK}}'
