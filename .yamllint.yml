extends: default
ignore: |
  node_modules/
  dist/
rules:
  document-start: disable
  line-length: disable
  # GitHub Actions uses the unquoted `on` key.
  truthy: disable
  # Intentional owns its YAML serialization, including indentless sequences.
  indentation: disable
  comments-indentation: disable
  comments:
    min-spaces-from-content: 1
