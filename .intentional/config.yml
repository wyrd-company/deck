$schema: https://intentional.foo/schemas/config.yml
contract: contract-2
settings:
  internal-dependency-bump: patch
discovery:
  managed-paths:
  - detector: go-module
    path: go.mod
    release-unit: deck
release-units:
  deck:
    path: .
    projections:
    - adapter: go
      file: go.mod
      mode: none
    tags:
      primary:
        role: primary
        template: '{version}'
