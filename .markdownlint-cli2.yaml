gitignore: true
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
  - "dist/**"
  - ".intentional/**"
config:
  # Prose wraps to context; tables and links can exceed 80 columns.
  MD013: false
  # README uses a picture element for the light/dark product mark.
  MD033: false
  # The README starts with badges; the embedded skill starts with agent prose.
  MD041: false
  # User pages retain a visible H1 alongside their publishing title metadata.
  MD025:
    front_matter_title: ""
