slug: send-outcome-lost-in-a-service-crash
title: A send cut off by a service crash can repeat, go untracked or go unrecognised
description: >-
  The service remembers sends in flight and recent successes in memory, so a
  crash between Discord acting on a send and the service publishing it and
  answering the client loses what it knew. Three outcomes follow. A forum
  post that Discord created is created again when the client repeats it with
  the same nonce, since Discord does not deduplicate forum posts by nonce and
  the stream never received the first. A post whose thread registration had
  not reached the bucket is not touched, so it produces no events and its
  session sees it as not touched until a reply touches it again. A message
  deck sent that recovery later finds in Discord is published without its
  key and nonce, so the sending session counts it as unread and a relay may
  wake that session for it. Mitigation: replies and text channel posts are
  deduplicated by Discord's enforce_nonce; a repeat after the restart finds
  any send the stream holds by its nonce; Post registers in memory before it
  publishes and logs each registration still unwritten at a clean stop; the
  client reports an unknown outcome with the nonce instead of sending again
  on its own; and the window is only the time between Discord's answer and
  the publish acknowledgement.
categories:
  - operational
likelihood: 1
impact: 2
response-strategy: accept
status: accepted
