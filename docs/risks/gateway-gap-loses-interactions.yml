slug: gateway-gap-loses-interactions
title: Component uses and poll votes during a gateway gap are lost
description: >-
  When a bot's gateway session drops and cannot resume, or the service is
  not running, Discord does not replay the events in between. Messages in
  that gap are recovered: on every READY, the first after a start included,
  the service reads the messages after each registered thread's recorded
  boundary, for threads active now and threads archived since the bot was
  last seen, and publishes them. Component uses and poll votes in the gap
  cannot be read back from Discord, so they never reach the stream, and a
  person who pressed a button during the gap saw "This interaction failed".
  The same holds for the poll result Discord posts in a text channel for a
  text channel post's starter message, since recovery reads threads and not
  their parent channels. Mitigation: disgo resumes sessions where Discord
  allows, the healthcheck fails while a session is down so the container
  runtime can act, and the poll itself still shows every vote in Discord.
  Accepted for component uses.
categories:
  - operational
likelihood: 2
impact: 2
response-strategy: mitigate
status: mitigated
