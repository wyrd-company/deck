slug: gateway-gap-loses-interactions
title: Component uses and poll votes during a gateway gap are lost
description: >-
  When a bot's gateway session drops and cannot resume, or the service is not
  running, Discord does not replay the events in between. Messages in that gap
  are recovered: on every READY the service reads, for each of the bot's
  registered threads whose newest message is beyond its boundary, the messages
  after the boundary, and publishes them; a thread whose read fails keeps its
  boundary and is read again at the next READY. Component uses and poll votes
  in the gap cannot be read back from Discord, so they never reach the stream,
  and a person who pressed a button during the gap saw "This interaction
  failed". The same holds for the poll result Discord posts in a text channel
  for a text channel post's starter, since recovery reads threads and not
  their parent channels. Component uses and poll votes the gateway drops
  because 10,000 activities already wait for JetStream are lost the same way.
  Mitigation: disgo resumes sessions where Discord allows, the healthcheck
  fails while a session is down so the container runtime can act, and the poll
  itself still shows every vote in Discord. Accepted for component uses.
categories:
  - operational
likelihood: 2
impact: 2
response-strategy: mitigate
status: mitigated
