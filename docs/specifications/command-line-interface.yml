$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - configuration
    - grpc-api
    - events
    - client
  terms:
    - unread
    - cursor
    - persona
format: cli
description: >-
  One executable, `deck`, is both the client and the service. Every command
  accepts `--config PATH`, `--json` and `--help`; `deck --version` prints the
  version. Commands read the configuration as the configuration
  specification says.


  Sessions. The client's session commands run as a session. The session's
  identifiers are the variables in `session.variables` that are set and not
  empty, in configured order, and the first of them is the primary
  identifier, which keys the session in the local store. `--session
  NAME=VALUE` on any session command replaces detection with that one
  identifier. With no variable set and no `--session`, the command runs as the
  default session, whose identifier list is empty. The session commands are
  post, reply, inbox, read, history, listen, channels and skill. read and
  listen act on the session's own threads: a THREAD argument the session does
  not hold is a usage error that names `deck history` for reading it, and so
  is calling either with no THREAD argument when the session holds no
  threads.


  Unread report. After a session command does its work, the client counts the
  session's unread activity with the cursors as the command left them, and
  reports it: in text mode one line on stderr, `unread: 3 in 2 threads (deck
  read)`, or `unread: none`; in JSON mode an `unread` member of the result,
  `{"total": 3, "threads": [{"thread_id": "1571484634081529857", "count":
  2}]}`. When the count cannot be had, the line is `unread: unknown
  (<reason>)` and the member is `{"error": "<reason>"}`, and the command's
  own result and exit status stand. Threads whose channel the client's allow
  and deny lists exclude are left out of every count and list.


  References. A CHANNEL is an alias from `aliases.channels`,
  `[<bot>/]<snowflake>`, or omitted for `channels.default`. A THREAD is
  `[<bot>/]<snowflake>` or a Discord URL
  `https://discord.com/channels/<server>/<thread>[/<message>]`. A USER or ROLE
  is an alias from `aliases.users` or `aliases.roles`, or a snowflake. A
  reference made only of digits is a snowflake, and any other is an alias. The
  client checks every channel against `channels.allow` and `channels.deny`
  before it calls the service; for a reply into a thread the local store does
  not hold, it first asks the service for the thread's parent channel.


  Content flags, on post and reply. `--text TEXT` or `--text-file PATH`
  (`-` reads stdin) is the message text, in Discord markdown. `--mention USER`
  and `--mention-role ROLE` repeat, and each mention notifies. `--embed PATH`
  repeats; each file holds one Discord embed object or an array of them.
  `--components PATH` holds an array of Discord top-level component objects.
  `--poll QUESTION` with one `--answer TEXT` per answer adds a poll;
  `--poll-duration` is a Go duration rounded up to whole hours, default 24h,
  and `--poll-multiselect` allows several answers. `--file PATH` repeats and
  attaches the file under its base name. `--persona NAME` uses a configured
  persona, `--no-persona` uses none, and otherwise `default_persona` applies.
  At most one flag reads stdin, and a message needs text, an embed, components,
  a poll or a file.


  `deck post [CHANNEL] --title TITLE [--tag TAG]... [content flags]` creates a
  thread named TITLE: a forum post in a forum or media channel, with tags by
  name or snowflake, or in a text or announcement channel a message and a
  thread started from it. It records the thread against the session with the
  cursor at the new message. Text: `posted 1571484634081529857 in
  helper/1287000000000000002` and the thread URL, on stdout. JSON: `{"thread":
  Thread, "message": Activity, "unread": ...}`, with Thread and Activity in
  the protojson form of the gRPC API.


  `deck reply THREAD [--reply-to MESSAGE] [content flags]` sends a message
  into the thread. On the session's first message in the thread it records
  the thread with the cursor at that message; it always records the message as
  the session's own. Text: `replied 1571485045016997890 in
  1571484634081529857` and the message URL. JSON: as post.


  `deck inbox [--all]` lists the session's threads that have unread activity,
  or with `--all` every thread the session holds, the one the session touched
  most recently first. It changes no cursor. Text: one line per thread,
  `<count>  <thread>  <bot>/<channel>  <title>`. JSON: `{"threads":
  [{"thread_id": "1571484634081529857", "bot": "helper", "channel_id":
  "1287000000000000002", "title": "Changelog wording", "count": 2, "state":
  "THREAD_STATE_TOUCHED"}], "unread": ...}`.


  `deck read [THREAD...] [--keep-unread] [--limit N]` prints the unread
  activity of the given threads, or of all the session's threads, oldest
  first, up to N (default 500), and then moves each thread's cursor to the
  newest activity it printed for that thread, unless `--keep-unread`. Text:
  each thread opens with a line `## <title> (<thread>)`, and each activity is
  a line `<time> <author> <kind> <id>` followed by its content indented by two
  spaces: a message's text, one `embed:` line per embed with its title or
  author, one `attachment: <name> <size> <url>` line per file, and a poll's
  question and answers; a component use as `pressed <custom_id>` or `chose
  <values> in <custom_id>` on its message; a poll vote as `voted <answer>` or
  `removed vote <answer>` on its message. JSON: `{"activity": [Activity],
  "more": false, "unread": ...}`.


  `deck history THREAD [--after MESSAGE | --before MESSAGE] [--limit N]`
  prints messages from Discord, oldest first, N at most 100 (default 50), the
  newest when neither cursor is given. It works for any thread in a granted
  channel, touched or not, and changes no cursor and nothing on the service.
  Output: as read, with `"more"` telling whether Discord holds more in the
  cursor's direction.


  `deck listen [THREAD...] [--timeout DURATION] [--keep-unread]` waits on the
  given threads, or all the session's threads, and returns as soon as any of
  them has unread activity, printing all of it as read does and marking it
  read unless `--keep-unread`. Activity that is already unread when it starts
  returns at once. Without `--timeout` it waits until interrupted. When the
  service reports none of the threads as touched by the key, nothing can
  arrive, and listen exits 3 with each thread's state.


  `deck resolve THREAD` or `deck resolve --event PATH` (`-` reads stdin)
  prints the sessions in the local store that touched the thread, or the
  event's thread, and that have identifiers, oldest touch first. Given an
  event whose message the session sent itself, it leaves that session out, so
  a relay does not wake a session for its own message. It is not a session
  command, reads only the local store and contacts nothing. Text: one line per
  session, its identifiers as `NAME=VALUE` separated by spaces, in configured
  order. JSON: `{"sessions": [{"primary": "T3CODE_THREAD_ID", "identifiers":
  [{"name": "T3CODE_THREAD_ID", "value": "..."}], "touched_at":
  "2026-11-15T11:18:53Z"}]}`. No matching session is success with no lines,
  or an empty list.


  `deck channels` lists the channels the key's grants cover and the allow and
  deny lists keep: one line per channel, `<bot>/<channel>  <type>  <server
  name> / <name>  [alias]`. JSON: `{"channels": [Channel], "unread": ...}`.


  `deck skill` prints the agent skill embedded in the executable, a Markdown
  file with name and description front matter, to stdout. It needs no
  configuration; without one, its unread line is `unread: unknown (no
  configuration)`.


  `deck config validate` loads the client configuration without contacting
  anything and prints `ok <path>`, or one line per failure, `<file>:
  <field path>: <reason>`. `deck config key` reads the Transit key's public
  half and prints it as an authorized-keys line with the comment
  `deck:<key name>`, then its SHA256 fingerprint, for the service's operator
  to add to the service configuration.


  `deck service start` runs the service until SIGTERM or SIGINT, then closes
  the SSH listener, ends open calls, closes the gateway sessions and drains
  NATS within 10 seconds. It logs JSON lines to stderr. `deck service
  validate` checks the service configuration as config validate does.
  `deck service health` requests `/healthz` from `listen.health` on the
  loopback address, prints the response body, and exits 0 when it is healthy;
  the container image's HEALTHCHECK runs it. `deck service host-key` reads the
  host key from OpenBao or Vault and prints its public half and fingerprint,
  for clients' `service.host_key`.


  Output. Text output goes to stdout and diagnostics to stderr, prefixed
  `deck: `. In JSON mode stdout holds exactly one JSON object: the result, or
  `{"error": {"category": "<category>", "message": "<text>"}}`. No output
  holds a bot token, an OpenBao token, a signature or a private key.


  Exit statuses are categorical. 0: success. 1 (`failed`): anything not below.
  2 (`invalid`): a usage error, an invalid configuration, an invalid event, or
  content the service rejects as invalid. 3 (`refused`): the allow or deny
  lists, or the key's grants (PERMISSION_DENIED), do not cover the target, or
  the bot cannot see it (NOT_FOUND). 4 (`unavailable`): the service, OpenBao or
  Vault, or a service dependency (UNAVAILABLE, RESOURCE_EXHAUSTED) cannot be
  reached. 5 (`timeout`): listen's timeout passed with no activity. 130:
  interrupted.
validation-criteria: >-
  Command tests run every command against a fake service over a real SSH
  connection and check exact text and JSON output, each exit status for the
  case that causes it, the unread report after every session command and its
  absence after the others, that read and listen move cursors only without
  `--keep-unread`, and that the allow and deny lists refuse before any call
  reaches the service. A test shows that no output contains a token,
  signature or private key, and that an environment variable outside
  `session.variables` changes nothing.
