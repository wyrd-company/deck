$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - transport
    - events
    - discord-conversations
  shaped-by:
    - give-each-thread-one-bot
    - carry-embeds-and-components-as-discord-json
    - define-events-as-the-api-activity
    - read-threads-by-id-in-granted-channels
format: protobuf
description: >-
  The service serves one gRPC service, `deck.v1.DeckService`, defined by
  `assets/grpc-api/deck/v1/deck.proto`. That file is the source the Go code
  is generated from; nothing else defines the API. It runs over the `deck` SSH
  subsystem as the transport technical design describes, and every call acts
  with the grants of the client key that signed the SSH connection. No call
  carries credentials or a session identity of its own.


  Identifiers are Discord snowflakes in uint64 fields; zero means absent. A
  bot is named by its name in the service configuration. A touched thread has
  one bot, the one that first touched it through deck, and every call on the
  thread uses it: a reference may leave the bot empty. The grant check runs
  against the thread's bot first, so a key without a grant covering the
  thread through that bot is refused with PERMISSION_DENIED, and only a key
  with one that named another bot gets INVALID_ARGUMENT naming the thread's
  bot. Keys share a thread by holding grants on its bot. For a channel, or a thread not touched,
  an empty bot means the one bot the calling key's grants name, and is
  INVALID_ARGUMENT when they name several.


  Every call that names a target checks it in this order, before it sends or
  reads anything else: the bot is named in at least one of the key's grants;
  the target's server and parent channel come from that bot's Discord
  metadata (cache, or a REST read), never from the request or the grant; and
  some grant names that bot, that server, and the channel or `*`. A target
  that fails any step, including one the bot cannot see, is refused with
  PERMISSION_DENIED and one message for every case, so a refusal does not tell
  whether the target exists.


  Post and Reply carry the client's `nonce`, an identifier for the send. A
  repeat of a nonce by the same key while the first call is in flight waits
  for it and returns its result; a repeat within 10 minutes of a success
  returns that result without sending again; a repeat of a failure runs
  again. After a service restart, a repeat whose nonce the event stream holds
  for that key returns that message. Reply and a text channel post also send
  the nonce to Discord with enforce_nonce, which answers a repeat with the
  first message; a forum post has no such deduplication in Discord. The nonce
  travels on the published message, and is how a client recognises its own
  messages in counts, lists and events.


  Content carries embeds and components as `google.protobuf.Struct` values
  that hold Discord's own JSON objects. The service decodes them into
  Discord's types and lets Discord validate them; a Discord validation error
  (code 50035) returns INVALID_ARGUMENT with Discord's field paths in the
  message. Limits are Discord's (API v10): 2000 characters of text, 4096 with
  a persona since the text then fills an embed description, 10 embeds holding
  at most 6000 characters together, 10 files, a thread title of 1 to 100
  characters, 5 forum tags, a poll of 1 to 10 answers lasting 1 to 768 hours.
  The service checks the limits it can count before calling Discord. Each
  request is at most 64 MiB, which bounds files; Discord refuses a file over
  the server's upload limit, and the service returns that as
  INVALID_ARGUMENT naming the file.


  Activity is the one shape for everything new in a thread. Post and Reply
  return the message they created as an Activity and a stream position for the
  session's cursor to start at. ListHistory returns messages in snowflake
  order, oldest first; ListUnread and Listen return activity in stream order,
  the order the service published it, with each activity's sequence and the
  response's epoch; the event stream carries one Activity per event in its
  protojson form, without the sequence. An Activity's attachment URLs from the
  API are current: for unread messages with attachments the service reads the
  thread's messages from Discord after the snowflake one less than the oldest
  of them, 100 per request, and takes their URLs; when Discord no longer has a
  message, or cannot be read within the deadline, it returns the URLs it
  published.


  Unread is computed from the event stream and from cursors the client sends,
  and never from Discord. A Cursor is a thread and a stream position; the
  activity after it is the thread's activity at a later position in the same
  epoch, or all of the thread's activity the stream holds when the cursor is
  from another epoch. Activity that reaches the stream late, such as a held
  message, a recovered message or a poll vote stamped by the service's clock,
  is therefore still after a cursor that moved past it in snowflake terms.
  Messages whose type is not 0, 19 or 46 are never counted. Each count
  includes the calling key's own messages and lists them with their nonces in
  `own`, and the client takes away those its session sent. A thread whose
  stream history no longer reaches back to the cursor answers with
  `horizon_passed`; what fell out of the stream is read with ListHistory. A
  thread that the calling key did not touch answers with the state
  NOT_TOUCHED and no count, and one whose parent is outside the grants with
  NOT_GRANTED; neither fails the call. ListUnread returns at most its limit in
  stream order and sets `more` when activity remains; a client that marks
  read moves each cursor to the position of the last activity it received for
  that thread, never to an earlier position in the same epoch, and to the
  current epoch's positions when its epoch differs.


  Listen answers at once with each thread's state and any unread activity,
  and then sends each further activity as it is published. The client ends the
  call when it has what it waited for, or when its own timeout passes. A Listen
  call stays open through gRPC keepalive pings, as the transport design sets.


  Errors are gRPC status codes. INVALID_ARGUMENT: a malformed request, an
  ambiguous bot, a bot other than a touched thread's, content beyond a limit,
  a forum post without the tag its forum requires, or Discord's validation
  error. PERMISSION_DENIED: a target that fails the grant check above.
  NOT_FOUND: a message that `reply_to_message_id` names does not exist in the
  granted thread (Discord code 10008). FAILED_PRECONDITION: the channel's
  type does not take posts, the thread is locked, or the bot lacks a Discord
  permission the call needs (Discord code 50013), with the permission named
  when Discord names it. RESOURCE_EXHAUSTED: Discord's rate limit would hold
  the call past its deadline. UNAVAILABLE: the bot's gateway session,
  Discord's REST API, or NATS cannot be reached for this call. UNAUTHENTICATED:
  a call with no key on its connection, which the SSH listener never lets
  through. INTERNAL: anything else, with no upstream text. No status message
  carries a token, a request URL or a Discord response body other than
  Discord's validation field paths and the name of a missing permission.
validation-criteria: >-
  `buf build` and `buf lint` (the STANDARD rules) pass on
  `assets/grpc-api`, and the generated Go code in the repository matches what
  the proto generates, checked by `task check`. Service tests drive every call
  over a real SSH connection against a fake Discord REST API and an embedded
  JetStream server, and show each error code above for the case that causes
  it, a same-bot wildcard grant on one server refusing a channel of another
  server, an ungranted bot refused before any Discord request, a repeated
  nonce returning the first result without a second send (also while the
  first is in flight, and for a text channel post repeated after a restart,
  which takes the thread Discord already started), a Post whose registry
  bucket is unreachable creating nothing, two concurrent replies by one key,
  one failing, leaving the key's touch in place, a failed first reply leaving
  the thread untouched, and a key granted only another bot refused for a
  touched thread with PERMISSION_DENIED. A contract test marshals Activity values of each kind with protojson
  and proto field names and validates them against
  `assets/events/activity.schema.json`.
