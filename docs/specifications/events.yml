$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - grpc-api
    - service
    - configuration
  shaped-by:
    - define-events-as-the-api-activity
    - keep-message-history-in-discord
format: json-schema
description: >-
  The service publishes one JetStream message, an event, for each activity in
  a touched thread, and nothing for any other thread. Only the thread's bot
  publishes: when several of deck's bots can see a touched thread, the others
  ignore it. Activity on the starter message of a thread started in a text or
  announcement channel (a poll vote or component use on it, its poll result,
  a reply to it in the channel) belongs to that thread.


  The subject is `<prefix>.<server id>.<channel id>.<thread id>`, with each
  snowflake in decimal and the channel being the thread's parent. The prefix is
  `nats.subject_prefix` in the service configuration, default `deck`: one or
  more dot-separated tokens of letters, digits, `-` and `_`. A subscriber
  narrows by server, channel or thread with NATS wildcards, such as
  `deck.1287000000000000001.>` for one server, and NATS authorization decides
  who may subscribe to what.


  The payload is a `deck.v1.Activity` from the gRPC API, encoded by protojson
  with proto field names: UTF-8 JSON defined by
  `assets/events/activity.schema.json`, with one example of each kind under
  `assets/events/examples/`. Exactly one of `message`, `component` and
  `poll_vote` is present. protojson omits every field that holds its zero
  value (an absent `type` is 0, an absent `bot` flag is false), writes uint64
  values such as snowflakes and sizes as decimal strings, writes timestamps as
  RFC 3339 in UTC, and varies insignificant whitespace between runs, so a
  consumer parses the JSON and never compares bytes. A message deck sent
  carries `sent_by`, the name of the client key that sent it, and `nonce`, the
  sending client's identifier for that send. The payload never carries
  `sequence`; the stream's message metadata holds it. Attachment URLs are the
  ones Discord gave when the message arrived, and Discord's CDN expires them;
  the API returns current ones.


  Every event carries these headers. `Nats-Msg-Id` is `message:<id>` or
  `component:<id>` with the Discord snowflake, and for a poll vote
  `poll_vote:<message id>:<user id>:<answer id>:<add|remove>`, which does not
  depend on the service's clock, so JetStream drops a repeat within the
  stream's duplicate window from any publisher. `Deck-Kind` is `message`,
  `component` or `poll_vote`. `Deck-Activity-Id` is the activity's snowflake.
  `Deck-Message-Type` is the Discord message type, on messages only.
  `Deck-Sent-By` is the client key's name and `Deck-Nonce` the client's nonce,
  on messages deck sent only. `Deck-Schema` is `deck.v1.Activity`. The headers carry everything the
  service's activity index needs, so the index replays the stream headers
  only.


  The stream is `nats.stream.name` (default `DECK`) with the single subject
  `<prefix>.>`, file storage, limits retention, discard old, a maximum age of
  `nats.stream.max_age` (default 168h) and a duplicate window of
  `nats.stream.duplicate_window` (default 2m). With `nats.stream.manage` true,
  the default, the service creates the stream when it is missing and updates
  these settings when they differ; with it false, the service requires the
  stream to exist and to cover the subject. Events leave the stream when they
  pass the maximum age, and from then on the activity they held is gone:
  Discord still holds messages, and nothing holds component uses or poll
  votes.


  Ordering is the stream's: the service publishes a thread's activity in the
  order it receives it, and consumers that need snowflake order sort by `id`.
  Delivery to subscribers is JetStream's: at least once for a durable
  consumer that acknowledges.
validation-criteria: >-
  `check-jsonschema --check-metaschema` accepts the schema, and every file in
  `assets/events/examples/` validates against it. A contract test marshals an
  Activity of each kind as the service publishes it and validates the bytes
  against the schema. An events test against an embedded JetStream server
  shows the subject, every header, de-duplication of a repeated activity, and
  that activity in a thread nobody touched publishes nothing. Against a fake
  Discord it also shows: two bots that see one touched thread publish each
  message once, with `sent_by`, and one poll vote seen by both once; a poll
  vote, a component use and a reply on a text channel post's starter message
  published on the thread's subject; and recovery after a restart publishing,
  once each, the messages sent while the service was down, in a thread that
  stayed active and in one that archived again, with live messages during
  recovery and a crash in the middle of it leaving none behind.
