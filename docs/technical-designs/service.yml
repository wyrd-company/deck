$schema: https://refinery.systems/ontology/technical-design
relationships:
  implements:
    - grpc-api
    - events
    - configuration
  shaped-by:
    - give-each-thread-one-bot
    - discord-forum-post-and-gateway-reply
    - keep-message-history-in-discord
    - record-touched-threads-in-jetstream-key-value
    - define-events-as-the-api-activity
    - carry-embeds-and-components-as-discord-json
    - start-a-thread-for-every-post
    - read-threads-by-id-in-granted-channels
  assumes:
    - person-replies-arrive-with-content
    - component-interactions-reach-the-gateway
    - each-bot-fits-one-gateway-session
  mitigates:
    - gateway-gap-loses-interactions
  related-to:
    - transport
    - discord-conversations
objective: >-
  Run `deck service start`: hold every configured bot's Discord session, post
  and reply on behalf of client keys within their grants, publish every
  activity in touched threads to JetStream and nothing else, answer unread
  counts, lists and listens from the stream, and report itself healthy only
  while every gateway session and NATS are connected.
background:
  current-design: >-
    No service exists. The discord-forum-post-and-gateway-reply spike showed
    disgo v0.20.0 creating a forum post whose starter message held text, a
    persona embed, a button and a poll, a thread started from a text channel
    message, gateway
    delivery of replies in about 200 ms, and the gateway delivering a new
    post's starter message before the REST call that created the post
    returned.
  problems:
    - Activity must reach JetStream for touched threads only, and a thread's
      identifier is unknown until Discord answers the call that creates it.
    - Component interactions must be acknowledged within three seconds, long
      before any agent could answer.
    - Every client command asks for an unread count, which must not cost a
      Discord call per thread.
    - The service is a container with no volume; what it must remember lives
      in NATS.
design-challenges:
  events-before-registration: >-
    The gateway can deliver an event for a thread before deck knows the thread
    is touched, and can deliver deck's own message before the REST call that
    sent it returns. A settling buffer holds two kinds of gateway event for up
    to 10 seconds: an event whose thread is not registered and whose thread
    snowflake is less than 10 seconds old, and a message whose author is the
    bot's own user while a send by that bot into that thread is in flight. A
    hold ends when the thread registers, or the REST path publishes the
    message's snowflake, or the in-flight sends end; then the event is
    published if its thread is touched, and dropped if the REST path already
    published it. After 10 seconds the event is published if its thread is
    touched and dropped otherwise. A message from the bot's user with no send
    in flight, such as a poll result, is not held. The buffer holds at most
    10,000 events and drops the oldest beyond that, with a log line. Held
    events reach the stream after events with greater snowflakes, which is why
    cursors follow stream sequences.
  acknowledgement-deadline: >-
    The handler for a component interaction responds with a deferred message
    update (interaction response type 6) before it does anything else, and
    then publishes. It acknowledges every component interaction on a deck bot,
    touched thread or not, so nobody sees "This interaction failed" on a deck
    message.
  gateway-gaps: >-
    disgo resumes a dropped gateway session, and Discord replays the events
    missed while resuming. When a session cannot resume and a new one starts,
    or the service was not running, events in between are lost, and recovery
    reads the messages among them back from Discord. Recovery runs for a bot
    on every READY, the first after a start included, once the activity index
    has replayed. Its boundary for each of the bot's registered threads is the
    registry entry's last_message_id, the newest message the service published
    for the thread, which the service snapshots in the READY handler before it
    handles any later event of that session (disgo dispatches a session's
    events in order), so live traffic cannot move it. The threads to visit are
    the registered ones GUILD_CREATE lists as active with a last_message_id
    beyond their boundary, and the registered ones archived since the bot was
    last seen: for each parent channel holding registered threads of the bot,
    the service lists public archived threads and joined private archived
    threads, newest archive first, until their archive_timestamp is older than
    the bot's heartbeat minus one minute. A thread that got a reply and
    archived again while deck was down is found that way. For each thread it
    reads the messages after the boundary from Discord, 100 per request,
    publishes each one the index does not hold, and only then raises the
    entry's last_message_id; while a thread's recovery is pending, live
    publishes do not raise it, so a crash during recovery leaves the boundary
    where it was. A thread Discord reports as deleted (code 10003)
    leaves the registry; one the bot can no longer read (code 50001) is logged
    and kept. Component uses and poll votes in the gap cannot be recovered;
    the risk gateway-gap-loses-interactions covers them.
  cheap-unread: >-
    Unread counts come from an in-memory activity index that follows the event
    stream, so a count costs no Discord or NATS request, whatever the cursor.
    Unread covers what the stream holds; a cursor older than the stream's
    oldest message is answered with horizon_passed, and the client reads what
    fell out with ListHistory.
  overlapping-bots: >-
    Several of deck's bots can be in one server and see one thread. A touched
    thread has one bot, recorded in its registry entry, and only that bot's
    gateway session publishes the thread's events; the others drop them. A
    call on a touched thread uses that bot, and a call that names another bot
    is refused with INVALID_ARGUMENT, so a key shares a thread only through a
    grant on its bot. Every bot acknowledges every component interaction it
    receives, and publishes it only when the interaction's thread is
    registered to that bot. A poll vote's deduplication identifier is built
    from the message, the user, the answer and the direction, so a vote that
    two publishers see is stored once.
  partial-sends: >-
    A post can fail after Discord created the thread. Post therefore reads the
    registry bucket's status before it calls Discord and returns UNAVAILABLE
    without posting when the bucket cannot be reached. Once Discord answers,
    the service registers the thread in memory at once, so this process
    publishes the thread's events from then on, and writes the entry to the
    bucket, retrying in the background until it lands; the call does not wait
    for that write. A registration still unwritten when the service stops is
    logged with the thread's snowflake as lost. Every Post and Reply carries
    the client's nonce: the service keeps each key's nonces and their results
    for 10 minutes and answers a repeat with the first result without sending
    again, and Reply passes the nonce to Discord with enforce_nonce, so a
    repeat after a restart is dropped by Discord as well. A reply's touch is
    never rolled back: the key is added before the send and stays whatever the
    send's outcome, so no rollback can remove a touch another reply relies on.
proposed-design:
  high-level-overview: >-
    One process holds: one disgo client per bot; one NATS connection with a
    JetStream publisher, the thread registry (a key-value bucket mirrored in
    memory) and the activity index (an ordered, headers-only consumer of the
    stream mirrored in memory); the SSH and gRPC server of the transport
    design; and the HTTP healthcheck. Gateway events flow from a bot through
    the touched-thread filter and the settling buffer to the publisher; API
    calls go to Discord's REST API through the bot's client and read activity
    from the index and the stream.
  startup-and-shutdown: >-
    Start: load and validate the configuration; open the OpenBao or Vault
    client and read the host key, the NATS credentials and every bot token;
    connect to NATS; create or check the stream and the bucket as `manage`
    says; load the registry and start watching it; start the index's replay;
    open every bot's gateway session; open the SSH listener and the health
    listener. A failure before the listeners open exits with status 1 and a
    log line naming the step and the configuration path involved. API calls
    that read the index wait for its replay to reach the stream's last
    sequence at start, up to the call's deadline. SIGTERM or SIGINT closes the
    SSH listener, ends open calls, closes the gateway sessions, drains NATS and
    exits 0, within 10 seconds.
  bots: >-
    Each bot is a `bot.Client` from `disgo.New` with gateway intents guilds,
    guild messages, message content and guild message polls, and caches for
    guilds, channels, threads and members it sees. Its listeners handle guild
    MESSAGE_CREATE, INTERACTION_CREATE for components, MESSAGE_POLL_VOTE_ADD
    and MESSAGE_POLL_VOTE_REMOVE, READY and GUILD_CREATE, and ignore direct
    messages. A bot's token lives only inside its client. The bot registry
    maps bot names to clients and is the only path to Discord.
  thread-registry: >-
    The bucket `nats.threads.bucket` holds, with history 1, one entry per
    touched thread under `threads.<thread snowflake>` and one heartbeat per
    bot under `bots.<bot name>`. A thread entry, which expires after
    `nats.threads.max_age` without a write when that is set, is JSON: `bot`
    (the thread's one bot), `server_id`, `channel_id` (the parent),
    `created_by_deck`, `keys` (a map from key name to the RFC 3339 time it
    first touched the thread), `touched_at`, and `last_message_id`, the newest
    message the service published for the thread, set at registration to the
    post's or reply's own message and raised as the service publishes, at most
    once a second per thread and on a clean stop. A heartbeat is `{"seen_at":
    <RFC 3339>}`, written every 60 seconds while the bot's gateway session is
    Ready. Writes use the entry's revision, so concurrent writers retry and
    never lose a key. The service loads every entry at start and watches the
    bucket, and its in-memory map is what the gateway filter, routing and the
    grant checks read. A post registers the thread after Discord answers with
    its snowflake, as partial-sends describes; a reply adds the key before it
    sends the message and never removes it.
  posting: >-
    Post checks the channel in the grant order the gRPC API specifies, taking
    the channel's server from the bot's Discord metadata, and refuses a type
    other than 0, 5, 15 or 16 with FAILED_PRECONDITION. It answers a nonce it
    already holds for the key with the earlier result, and reads the registry
    bucket's status, returning UNAVAILABLE without posting when the bucket
    cannot be reached. It builds a `discord.MessageCreate`: mentions become
    `<@id>` and `<@&id>` tokens at the start of the content and the only
    entries of allowed_mentions, with `parse` empty and replied_user false;
    with a persona, the text becomes the description of a leading embed whose
    author is the persona and the content holds only the mentions; embeds and
    components decode from their Struct JSON into disgo's types, and a
    component list with a type of 9 or above sets the IS_COMPONENTS_V2 flag (1
    << 15) and requires empty text, embeds, poll and persona, its mention
    fields then setting allowed_mentions for tokens in its text displays;
    files become `discord.File` values. In a forum or media channel it calls
    CreatePostInThreadChannel with the title and tags, resolving tag names to
    the channel's available tags and requiring one when the channel's
    REQUIRE_TAG flag is set (INVALID_ARGUMENT without one). In a text or
    announcement channel it sends the message with the nonce and
    enforce_nonce, then starts a thread from it with the title; if the thread
    cannot be started it deletes the message and returns the error. Discord's
    error 50013 becomes FAILED_PRECONDITION naming the missing permission. It
    then registers the thread, publishes the first message from the REST
    response with `sent_by` and `nonce` set, waits for JetStream's
    acknowledgement within the call's deadline, and returns the thread, the
    message and a position: the message's own when acknowledged, otherwise the
    index's newest, while the publisher keeps retrying.
  replying: >-
    Reply checks the thread in the grant order the gRPC API specifies: a
    touched thread's bot, server and parent come from the registry, and a
    reference that names another bot is INVALID_ARGUMENT; a thread not touched
    takes its server and parent from the bot's Discord metadata (cache, or
    REST GetChannel). It refuses a channel that is not a thread (type 10, 11
    or 12) and a locked thread, answers a nonce it already holds for the key
    with the earlier result, adds the key to the registry (registering the
    thread with this bot when it is not touched), sends the message built as
    for a post with the nonce and enforce_nonce and a message reference when
    `reply_to_message_id` is set, and publishes it from the REST response with
    `sent_by` and `nonce` set, returning a position as a post does. Discord
    unarchives an archived thread when the message arrives.
  publishing: >-
    The publisher turns each activity into an event as the events
    specification defines (subject, headers, protojson payload) and publishes
    it with a JetStream acknowledgement. A failed publish is retried with
    backoff from 100 ms to 5 s for as long as the stream's duplicate window,
    then logged with the activity's kind and snowflake and dropped. A bot's
    gateway events are published only for threads registered to that bot, only
    when not held, and after routing: an event whose channel is not a thread
    but which concerns a message whose snowflake is a registered thread whose
    parent is that channel (a poll vote or component use on the message, a
    poll result whose message reference is the message, a reply that
    references the message) belongs to that thread, since a thread started
    from a message has the message's snowflake. A poll vote's snowflake is
    `(milliseconds since 2015-01-01T00:00:00Z) << 22` plus a per-process
    counter modulo 2^22, taken when the vote arrives, and its deduplication
    identifier does not use it. The author of a poll vote carries the username
    when the bot's member cache has it and only the snowflake otherwise.
  activity-index: >-
    An ordered consumer with headers only and deliver policy all follows
    `<prefix>.>` from the stream's first message and stays live. For each
    event it records, under the thread from the subject: the activity's
    snowflake, kind, message type, `sent_by` and nonce from the headers, and
    the stream sequence and timestamp from the message's metadata. Entries per
    thread stay in sequence order, and entries older than the stream's maximum
    age are pruned every minute. The index also holds the stream's epoch (its
    creation time in Unix nanoseconds, from the stream's information) and its
    first and last sequence. When the stream's epoch changes, the index starts
    again from the new stream. The index is the only source of unread counts,
    lists and listens, and every instance of the service that follows the
    stream holds the same index.
  unread: >-
    CountUnread, for each cursor whose thread the calling key touched and
    whose parent is granted, takes the thread's index entries after the
    cursor: those with a greater sequence when the cursor's epoch is the
    stream's, and all of them otherwise. It counts the ones that are not
    messages of a type other than 0, 19 or 46, lists among them the messages
    whose `sent_by` is the calling key with their nonces, and sets
    horizon_passed when the cursor's epoch is not the stream's or the cursor's
    sequence is below the stream's first sequence minus one. It reads no
    Discord and no stream message. ListUnread takes the same entries in
    sequence order up to the limit, reads each event body from the stream by
    sequence, and refreshes attachment URLs: for a thread whose listed
    messages carry attachments it reads the thread's messages from Discord
    after the snowflake one less than the oldest of them, 100 per request,
    within the call's deadline, and takes their URLs, keeping the published
    URLs for any it did not reach. Listen registers a waiter on its threads in
    the index, answers at once with the states and current unread activity,
    and then streams each new entry that counts. Responses carry the stream's
    epoch.
  history: >-
    ListHistory checks the thread in the grant order the gRPC API specifies,
    reads Discord's messages with the given cursor and limit through the
    thread's bot, and returns them oldest first as Activity values, with
    `sent_by` and nonce for messages the index holds with them. For a thread
    started from a message in a text or announcement channel, the thread's
    first message in Discord is a starter reference (type 21); ListHistory
    returns in its place the starter message itself, read from the parent
    channel under the thread's snowflake, whenever the requested range reaches
    the start of the thread. It neither touches the thread nor reads the
    stream otherwise.
  channels: >-
    ListChannels walks each grant of the calling key, takes the server's
    channels from the bot's cache, and returns those of types 0, 5, 15 and 16
    that the grant covers, with the server's name and each forum's tags.
  healthcheck: >-
    The health listener serves `GET /livez`, 200 while the process runs, and
    `GET /healthz`, 200 when every bot's gateway status is Ready, the NATS
    connection is CONNECTED, and the activity index has finished its replay;
    otherwise 503. Both bodies are JSON: `{"status": "ok"}` or `{"status":
    "fail", "bots": {"helper": "disconnected"}, "nats": "reconnecting",
    "index": "replaying"}`, naming every check. A gateway session that is
    reconnecting or resuming counts as disconnected. The container image runs
    `deck service health` as its HEALTHCHECK, every 10 seconds with 3
    retries and a 60-second start period, which covers the index's headers-only
    replay of the stream.
  logging: >-
    The service logs JSON lines to stderr with log/slog: start, stop, gateway
    state changes, NATS state changes, refused calls with the key name and the
    gRPC code, publish failures, and buffer overflow. A log line holds
    snowflakes, names and categories, never a token, a message's content, a
    file or a Discord response body. disgo's own logger is wired to the same
    handler at warning level.
  nats-permissions: >-
    The service's NATS user publishes on `<prefix>.>`; publishes and
    subscribes on `$KV.<bucket>.>` for the registry's writes and watch;
    publishes on `$JS.FC.>`, where the watch's ordered push consumer answers
    flow control; uses the JetStream API (`$JS.API.>`) for its stream, its
    consumers and the bucket's stream `KV_<bucket>` (create and update only
    when `manage` is true); and subscribes on its own inbox. Subscribers of
    events need no permission on the bucket.
  container: >-
    The image `ghcr.io/wyrd-company/deck` holds the static `deck` executable,
    runs as a non-root user, exposes the SSH and health ports, reads
    `/etc/deck/config.yml`, and has the entrypoint `deck service start` and
    the HEALTHCHECK above. It needs no volume. Each bot needs View Channel,
    Send Messages, Send Messages in Threads, Create Public Threads, Create
    Polls, Embed Links, Attach Files and Read Message History in every channel
    a grant names for it, and Mention Everyone where a client mentions a role
    that is not mentionable. A missing permission fails the call with
    FAILED_PRECONDITION naming it; a role mention without Mention Everyone is
    sent and does not notify, as Discord does.
  modules: >-
    `internal/service` wires the process and owns startup and shutdown.
    `internal/service/discord` owns the bot registry, the gateway listeners,
    the settling buffer, acknowledgement, backfill and the translation between
    disgo's types and Activity and Content. `internal/service/registry` owns the
    bucket and its in-memory mirror. `internal/service/activity` owns the
    publisher and the index. `internal/service/api` implements
    `deck.v1.DeckService` from these. `internal/service/health` serves the
    health listener.
