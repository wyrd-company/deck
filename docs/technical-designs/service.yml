$schema: https://refinery.systems/ontology/technical-design
relationships:
  implements:
    - grpc-api
    - events
    - configuration
  shaped-by:
    - deliver-activity-at-least-once
    - give-each-thread-one-bot
    - discord-forum-post-and-gateway-reply
    - keep-message-history-in-discord
    - record-touched-threads-in-jetstream-key-value
    - define-events-as-the-api-activity
    - carry-embeds-and-components-as-discord-json
    - start-a-thread-for-every-post
    - read-threads-by-id-in-granted-channels
  assumes:
    - one-service-instance-per-configuration
    - poll-votes-reach-the-gateway
    - discord-deduplicates-a-repeated-nonce-for-minutes
    - person-replies-arrive-with-content
    - component-interactions-reach-the-gateway
    - each-bot-fits-one-gateway-session
  mitigates:
    - gateway-gap-loses-interactions
    - send-outcome-unknown
    - recovery-replays-published-messages
    - restored-stream-reuses-positions
  related-to:
    - transport
    - discord-conversations
objective: >-
  Run `deck service start`: hold every configured bot's Discord session, post
  and reply on behalf of client keys within their grants, publish every
  activity in touched threads to JetStream and nothing else, answer unread
  counts, lists and listens from the stream, and report itself healthy only
  while every gateway session and NATS are connected.
background:
  current-design: >-
    No service exists. The discord-forum-post-and-gateway-reply spike showed
    disgo v0.20.0 creating a forum post whose starter message holds text, a
    persona embed and a button, Discord dropping a poll from that starter, a
    poll working as the thread's second message, a thread started from a text
    channel message, gateway delivery of replies within a second, and the
    gateway delivering a new post's starter message before the REST call that
    created the post returned.
  problems:
    - Activity must reach JetStream for touched threads only, and a thread's
      identifier is unknown until Discord answers the call that creates it.
    - Component interactions must be acknowledged within three seconds, long
      before any agent could answer.
    - Every client command asks for an unread count, which must not cost a
      Discord call per thread.
    - Every promise the service makes about publishing, unread and repeated
      sends is set by deliver-activity-at-least-once, and each mechanism below
      keeps one of them.
    - The service is a container with no volume; what it must remember lives
      in NATS.
design-challenges:
  events-before-registration: >-
    The gateway can deliver an event for a thread before deck registers it: a
    forum post's starter arrives before Discord's answer to the post (measured
    by discord-forum-post-and-gateway-reply), and a person can reply within
    that round trip. A settling buffer holds every gateway event in a thread
    channel (type 10, 11 or 12) that is not registered and whose thread
    snowflake is less than 10 seconds old. Registration releases the thread's
    held events into publishing, where the rules below apply to them; a held
    event whose thread is still not registered after 10 seconds is dropped.
    Events in other channels are never held. How the buffer is bounded is task
    7's.
  acknowledgement-deadline: >-
    The handler for a component interaction responds with a deferred message
    update (interaction response type 6) before it does anything else, and
    then publishes. It acknowledges every component interaction on a deck bot,
    touched thread or not, so nobody sees "This interaction failed" on a deck
    message.
  gateway-gaps: >-
    disgo resumes a dropped gateway session, and Discord replays the events
    missed while resuming. When a session cannot resume and a new one starts,
    or the service was not running, events in between are lost, and recovery
    reads the messages among them back from Discord, per registered thread. In
    the READY handler, before it handles any later event of that session
    (disgo dispatches a session's events in order), the service copies each of
    the bot's registered threads' boundary, the registry entry's
    last_message_id, so live traffic cannot move the boundary recovery uses.
    Once disgo reports every server of the session ready (GuildsReady) and the
    activity index has replayed, the service reads, for each of the bot's
    registered threads, the thread's channel object; when its last_message_id
    is beyond the copied boundary, it reads the messages after the boundary,
    oldest first, publishes each as publishing says (dropping the bot's own
    type 0 and 19 messages, publishing each other message the activity index
    does not hold), and raises the entry's last_message_id to the newest
    message it read. A thread's recovery is pending from READY until a read of
    it succeeds, and while it is pending, live publishes do not raise its
    last_message_id, so a stop during recovery leaves the boundary before
    every message recovery has not read. A thread Discord reports as deleted
    (code 10003) leaves the registry. Any other failed read leaves the
    thread's boundary where it was and its recovery pending, so the thread is
    read again at the bot's next READY and never drops out of recovery. An
    archived thread keeps its last_message_id (measured), so archived and
    active, public and private threads are read alike. The cost is one channel
    read per registered thread per READY, plus one message read per 100 missed
    messages; the registry's sweep bounds the number of registered threads by
    `nats.threads.max_age`. Component uses and poll votes in the gap cannot be
    recovered; the risk gateway-gap-loses-interactions covers them.
  cheap-unread: >-
    Unread counts come from an in-memory activity index that follows the event
    stream, so a count costs no Discord or NATS request, whatever the cursor.
    Unread covers what the stream holds; a cursor older than the stream's
    oldest message is answered with horizon_passed, and the client reads what
    fell out with ListHistory.
  own-messages: >-
    A message deck sends is published by its send, the one path that knows its
    key, the key's fingerprint and the client's nonce. The gateway's and
    recovery's copies of a message the thread's bot authored with type 0
    (default) or 19 (reply) are dropped: deck sends only those types, and only
    deck holds the bot's token. Other types the bot authors are published from
    the gateway and by recovery like any other message, among them the type 46
    poll result Discord posts as the poll's bot when a poll ends (measured).
    This one rule replaces any correlation between copies: whichever copy
    reaches the service first, only the send's own publication carries the
    message. A send whose publication never happens, because the service
    stopped between Discord's answer and JetStream's acknowledgement, leaves
    the message off the stream (risk send-outcome-unknown).
  overlapping-bots: >-
    Several of deck's bots can be in one server and see one thread. A touched
    thread has one bot, recorded in its registry entry, and only that bot's
    gateway session publishes the thread's events; the others drop them, so
    each activity has one publisher. A call on a touched thread goes through
    the grant check against that bot: a key with no grant covering the thread
    through it is refused with PERMISSION_DENIED, and a key with one that
    named another bot gets INVALID_ARGUMENT naming the thread's bot. Keys
    share a thread through grants on its bot. Every bot acknowledges every
    component interaction it receives, and publishes it only when the
    interaction's thread is registered to that bot. A thread whose registry
    bot is no longer configured is outside every grant, since grants name
    configured bots only. A thread its bot can no longer see produces no
    events and refuses calls that need Discord with PERMISSION_DENIED; counts
    still answer from the index. Either entry stays until the registry's sweep
    removes it or the operator deletes `threads.<thread snowflake>` from the
    bucket, after which the next touch registers the thread with the touching
    bot.
  partial-sends: >-
    The repeated-sends guarantee of deliver-activity-at-least-once rests on
    two things. Sends in flight live in memory, keyed by the calling key's
    fingerprint and the client's nonce: a repeat while the first runs waits
    for it and returns its outcome, and once the service has called Discord a
    send runs to its end whatever happens to the client's call. A completed
    send is found in the activity index, whose entries carry the sending key's
    fingerprint and nonce: a repeat whose fingerprint and nonce the index
    holds returns that send's thread and messages without sending, for as long
    as the stream holds them, restart or not. Anything else sends: a repeat of
    a send that failed, and a repeat whose first send never reached the
    stream. The service sends Discord, for each reply and text channel post, a
    nonce derived from the key's fingerprint and the client's nonce (the first
    25 characters of the base32 SHA-256 of `<fingerprint>:<client nonce>`)
    with enforce_nonce, so a repeat Discord still remembers returns the first
    message (measured for an immediate repeat; assumption
    discord-deduplicates-a-repeated-nonce-for-minutes), and starting a text
    channel post's thread on a message that already has one fails with code
    160004 (measured), on which the service takes that thread; it deletes the
    message only when the thread fails for another reason. When Discord's
    answer to a forum post is lost, the service cannot tell whether the post
    exists, and the send ends UNAVAILABLE with its outcome unknown (risk
    send-outcome-unknown). Post reads the registry bucket's status before it
    calls Discord and returns UNAVAILABLE without posting when the bucket
    cannot be reached; once Discord answers, it registers the thread in memory
    and writes the entry, and returns without waiting for the write, which the
    service retries until it lands. Reply writes the key into the entry before
    it sends, and returns UNAVAILABLE without sending when that write fails. A
    key absent from the entry is written `pending` and marked `sent` when its
    send succeeds; a key already `sent` stays `sent` through later replies.
    Both states count as touched. When a send fails (the service refused it,
    or Discord answered with an error), the service removes the key only if it
    is still `pending` and no other send by that key into that thread is in
    flight, and removes an entry left with no keys that deck did not create,
    so a failed attempt touches nothing and a concurrent success is never
    undone. A send whose outcome is unknown leaves its key as it is, so the
    thread stays touched for the key whether or not the reply reached Discord.
proposed-design:
  high-level-overview: >-
    One process holds: one disgo client per bot; one NATS connection with a
    JetStream publisher, the thread registry (a key-value bucket mirrored in
    memory) and the activity index (an ordered, headers-only consumer of the
    stream mirrored in memory); the SSH and gRPC server of the transport
    design; and the HTTP healthcheck. Gateway events flow from a bot through
    the touched-thread filter and the settling buffer to the publisher; API
    calls go to Discord's REST API through the bot's client and read activity
    from the index and the stream.
  startup-and-shutdown: >-
    Start: load and validate the configuration; open the OpenBao or Vault
    client and read the host key, the NATS credentials and every bot token;
    connect to NATS; create or check the stream and the bucket as `manage`
    says; load the registry and start watching it; start the index's replay;
    open every bot's gateway session; open the SSH listener and the health
    listener. A failure before the listeners open exits with status 1 and a
    log line naming the step and the configuration path involved. API calls
    that read the index wait for its replay to reach the stream's last
    sequence at start, up to the call's deadline. SIGTERM or SIGINT closes the
    SSH listener, ends open calls, closes the gateway sessions, drains NATS
    and exits 0, within 10 seconds.
  bots: >-
    Each bot is a `bot.Client` from `disgo.New` with gateway intents guilds,
    guild messages, message content and guild message polls, and caches for
    guilds, channels, threads and members it sees. Its listeners handle guild
    MESSAGE_CREATE, INTERACTION_CREATE for components, MESSAGE_POLL_VOTE_ADD
    and MESSAGE_POLL_VOTE_REMOVE, READY and GUILD_CREATE, and ignore direct
    messages. A bot's token lives only inside its client. The bot registry
    maps bot names to clients and is the only path to Discord.
  thread-registry: >-
    The bucket `nats.threads.bucket` has history 1 and no time-to-live, and
    holds two kinds of key. `threads.<thread snowflake>` is one entry per
    touched thread, JSON: `bot` (the thread's one bot), `server_id`,
    `channel_id` (the parent), `created_by_deck`, `keys` (a map from key name
    to `{"touched_at": <RFC 3339>, "state": "pending" | "sent"}`),
    `last_message_id`, and `active_at` (RFC 3339, the latest touch or
    publish). `last_message_id` is the thread's recovery boundary and is never
    absent: registration sets it to the thread's last_message_id as Discord
    reports it when the service registers the thread (the post's starter for a
    new post, read with the grant check for a first reply), or to the thread's
    snowflake when Discord reports none; it is raised to each message the
    service publishes for the thread and each message recovery reads, and
    never lowered. How often the service writes it and `active_at` is task
    7's; a write that lags lets recovery publish a message again (risk
    recovery-replays-published-messages). `stream.generation` is `{"epoch":
    <Unix nanoseconds>, "created": <the stream's creation time>}`, as
    activity-index describes; nothing expires it. When `nats.threads.max_age`
    is set, the service sweeps the bucket every hour and deletes each thread
    entry whose `active_at` is older than that age; a delete, unlike an
    expiry, reaches every watcher, so every instance's memory drops the thread
    with it. Writes use the entry's revision, so concurrent writers retry; a
    writer whose retry finds the thread registered to another bot applies the
    routing rule of overlapping-bots instead of writing. The service loads
    every entry at start and watches the bucket, and its in-memory map is what
    the gateway filter, routing and the grant checks read.
  posting: >-
    Post checks the channel in the grant order the gRPC API specifies, taking
    the channel's server from the bot's Discord metadata, and refuses a type
    other than 0, 5, 15 or 16 with FAILED_PRECONDITION. It handles the nonce
    and the registry bucket's status as partial-sends describes, and takes the
    activity index's newest position as the position it will return, before it
    calls Discord. It builds a `discord.MessageCreate`: mentions become
    `<@id>` and `<@&id>` tokens at the start of the content and the only
    entries of allowed_mentions, with `parse` empty and replied_user false;
    with a persona, the text becomes the description of a leading embed whose
    author is the persona and the content holds only the mentions; embeds and
    components decode from their Struct JSON into disgo's types, and a
    component list with a type of 9 or above sets the IS_COMPONENTS_V2 flag (1
    << 15) and requires empty text, embeds, poll and persona, its mention
    fields then setting allowed_mentions for tokens in its text displays;
    files become `discord.File` values. In a forum or media channel it calls
    CreatePostInThreadChannel with the title and tags and without the poll,
    resolving tag names to the channel's available tags and requiring one when
    the channel's REQUIRE_TAG flag is set (INVALID_ARGUMENT without one), and
    then sends the poll, when there is one, as the thread's second message,
    because Discord drops a poll from a forum post's starter (measured); a
    poll that fails to send leaves the post in place and is reported in
    `poll_error`. In a text or announcement channel it sends the message, poll
    included, with the derived nonce and enforce_nonce, then starts a thread
    from it with the title, taking the existing thread on code 160004 as
    partial-sends describes. Discord's error 50013 becomes FAILED_PRECONDITION
    naming the missing permission. It then registers the thread, publishes
    each message it sent with `sent_by`, the key's fingerprint and the nonce,
    waits for JetStream's acknowledgement within the call's deadline, and
    returns the thread, the messages and the position taken before the call.
  replying: >-
    Reply checks the thread in the grant order the gRPC API specifies. A
    touched thread's bot, server and parent come from the registry, and the
    grant check runs against that bot before the reference's bot is compared,
    so a key not granted the thread through its bot gets PERMISSION_DENIED and
    only a granted key that named another bot gets INVALID_ARGUMENT. A thread
    not touched takes its server, parent and last_message_id from the bot's
    Discord metadata (cache, or REST GetChannel). Reply refuses a channel that
    is not a thread (type 10, 11 or 12) and a locked thread, handles the nonce
    and the key's `pending` entry as partial-sends describes (registering the
    thread with this bot and that last_message_id as its boundary when it is
    not touched), takes the activity index's newest position as the position
    it will return, sends the message built as for a post with the derived
    nonce and enforce_nonce and a message reference when `reply_to_message_id`
    is set, marks the key `sent`, and publishes the message with `sent_by`,
    the key's fingerprint and the nonce, returning that position. Discord
    unarchives an archived thread when the message arrives.
  publishing: >-
    The publisher turns each activity into an event as the events
    specification defines (subject, headers, protojson payload) and publishes
    it with a JetStream acknowledgement. A failed publish is retried with
    backoff for as long as the stream's duplicate window, then logged with the
    activity's kind and snowflake and dropped. A bot's gateway events and
    recovery's reads are published only for threads registered to that bot,
    only when not held, and only when they are not the bot's own type 0 or 19
    messages (own-messages). Routing: an event in a channel that is not a
    thread, about a message whose snowflake is a registered thread whose
    parent is that channel (a poll vote or component use on the message, or a
    poll result whose message reference is the message), belongs to that
    thread, since a thread started from a message has the message's snowflake.
    A poll vote's snowflake is `(milliseconds since 2015-01-01T00:00:00Z) <<
    22` plus a per-process counter modulo 2^22, taken when the vote arrives.
    The author of a poll vote carries the username when the bot's member cache
    has it and only the snowflake otherwise.
  activity-index: >-
    An ordered consumer with headers only and deliver policy all follows
    `<prefix>.>` from the stream's first message and stays live. For each
    event it records, under the thread from the subject: the activity's
    snowflake, kind, message type, `sent_by`, sending key's fingerprint and
    nonce from the headers, and the stream sequence and timestamp from the
    message's metadata. Entries per thread stay in sequence order, entries
    older than the stream's maximum age are pruned, and a map from fingerprint
    and nonce to entries serves partial-sends. The index also holds the
    stream's epoch and its first and last sequence. The epoch tells stream
    generations apart. At start, and whenever its consumer ends, which
    deleting, recreating or restoring the stream causes, the service reads the
    stream's information and the bucket's `stream.generation`; when the record
    is missing or its `created` differs from the stream's creation time, the
    service writes a new record whose epoch is the current time in Unix
    nanoseconds, or the recorded epoch plus one when the clock is not ahead of
    it, with a revision-checked write, and the index discards its entries and
    replays. So epochs only grow, and a stream that is deleted or recreated,
    or whose record is deleted, starts a new generation. A restore from a
    snapshot keeps the stream's creation time (measured by the round 2
    review), so its documented step is to delete `stream.generation` before
    the service runs on the restored stream (risk
    restored-stream-reuses-positions). Until a replay ends, calls that read
    the index wait up to their deadline and then return UNAVAILABLE, so no
    response pairs an epoch with another generation's sequences. The index is
    the only source of unread counts, lists, listens and completed sends, and
    every instance of the service that follows the stream holds the same
    index.
  unread: >-
    A thread's state for a key is NOT_TOUCHED unless the key is in the
    thread's registry entry, whatever its grants say, so a key cannot tell
    another key's thread from an unknown one. A key in the entry gets
    NOT_GRANTED when no grant of it covers the thread through the thread's
    bot, which includes a bot no longer configured, and TOUCHED otherwise.
    CountUnread takes, for each cursor whose thread is TOUCHED for the calling
    key, the thread's index entries after the cursor: those with a greater
    sequence when the cursor's epoch is the stream's, and all of them
    otherwise. It counts the ones that are not messages of a type other than
    0, 19 or 46, lists among them the messages whose sending key is the
    calling key with their nonces, and sets horizon_passed when the cursor's
    epoch is not the stream's or the cursor's sequence is below the stream's
    first sequence minus one. It reads no Discord and no stream message.
    ListUnread takes the same entries in sequence order up to the limit, reads
    each event body from the stream by sequence, refreshes attachment URLs
    (for a thread whose listed messages carry attachments it reads the
    thread's messages from Discord after the snowflake one less than the
    oldest of them, keeping the published URLs for any it does not reach
    within the deadline; a text channel post's starter, which lives in the
    parent channel, is read there by its snowflake), and returns `through`:
    the listed activity's last position when `more` is set, and otherwise the
    stream's last position when the list was taken, since every activity of
    those threads up to it is listed. Listen registers a waiter on its threads
    in the index, answers at once with the states, the current unread activity
    and its `through`, and then streams each new entry that counts, with
    `through` at that entry's position.
  history: >-
    ListHistory checks the thread in the grant order the gRPC API specifies,
    reads Discord's messages with the given cursor and limit through the
    thread's bot, and returns them oldest first as Activity values, with
    `sent_by` and nonce for messages the index holds with them. For a thread
    started from a message in a text or announcement channel, the thread's
    first message in Discord is a starter reference (type 21); ListHistory
    returns in its place the starter message itself, read from the parent
    channel under the thread's snowflake, whenever the requested range reaches
    the start of the thread. It neither touches the thread nor reads the
    stream otherwise.
  channels: >-
    ListChannels walks each grant of the calling key, takes the server's
    channels from the bot's cache, and returns those of types 0, 5, 15 and 16
    that the grant covers, with the server's name and each forum's tags.
  healthcheck: >-
    The health listener serves `GET /livez`, 200 while the process runs, and
    `GET /healthz`, 200 when every bot's gateway status is Ready, the NATS
    connection is CONNECTED, and the activity index has finished its replay;
    otherwise 503. Both bodies are JSON: `{"status": "ok"}` or `{"status":
    "fail", "bots": {"helper": "disconnected"}, "nats": "reconnecting",
    "index": "replaying"}`, naming every check. A gateway session that is
    reconnecting or resuming counts as disconnected. The container image runs
    `deck service health` as its HEALTHCHECK, every 10 seconds with 3 retries
    and a 60-second start period, which covers the index's headers-only replay
    of the stream.
  logging: >-
    The service logs JSON lines to stderr with log/slog: start, stop, gateway
    state changes, NATS state changes, refused calls with the key name and the
    gRPC code, publish failures, and buffer overflow. A log line holds
    snowflakes, names and categories, never a token, a message's content, a
    file or a Discord response body. disgo's own logger is wired to the same
    handler at warning level.
  nats-permissions: >-
    The service's NATS user publishes on `<prefix>.>`; publishes and
    subscribes on `$KV.<bucket>.>` for the registry's writes and watch;
    publishes on `$JS.FC.>`, where the watch's ordered push consumer answers
    flow control; uses the JetStream API (`$JS.API.>`) for its stream, its
    consumers and the bucket's stream `KV_<bucket>` (create and update only
    when `manage` is true); and subscribes on its own inbox. Subscribers of
    events need no permission on the bucket.
  container: >-
    The image `ghcr.io/wyrd-company/deck` holds the static `deck` executable,
    runs as a non-root user, exposes the SSH and health ports, reads
    `/etc/deck/config.yml`, and has the entrypoint `deck service start` and
    the HEALTHCHECK above. It needs no volume. Each bot needs View Channel,
    Send Messages, Send Messages in Threads, Create Public Threads, Create
    Polls, Embed Links, Attach Files and Read Message History in every channel
    a grant names for it, and Mention Everyone where a client mentions a role
    that is not mentionable. A missing permission fails the call with
    FAILED_PRECONDITION naming it; a role mention without Mention Everyone is
    sent and does not notify, as Discord does.
  modules: >-
    `internal/service` wires the process and owns startup and shutdown.
    `internal/service/discord` owns the bot registry, the gateway listeners,
    the settling buffer, acknowledgement, backfill and the translation between
    disgo's types and Activity and Content. `internal/service/registry` owns
    the bucket and its in-memory mirror. `internal/service/activity` owns the
    publisher and the index. `internal/service/api` implements
    `deck.v1.DeckService` from these. `internal/service/health` serves the
    health listener.
