$schema: https://refinery.systems/ontology/technical-design
relationships:
  implements:
    - grpc-api
    - events
    - configuration
  shaped-by:
    - give-each-thread-one-bot
    - discord-forum-post-and-gateway-reply
    - keep-message-history-in-discord
    - record-touched-threads-in-jetstream-key-value
    - define-events-as-the-api-activity
    - carry-embeds-and-components-as-discord-json
    - start-a-thread-for-every-post
    - read-threads-by-id-in-granted-channels
  assumes:
    - one-service-instance-per-configuration
    - person-replies-arrive-with-content
    - component-interactions-reach-the-gateway
    - each-bot-fits-one-gateway-session
  mitigates:
    - gateway-gap-loses-interactions
    - send-outcome-lost-in-a-service-crash
  related-to:
    - transport
    - discord-conversations
objective: >-
  Run `deck service start`: hold every configured bot's Discord session, post
  and reply on behalf of client keys within their grants, publish every
  activity in touched threads to JetStream and nothing else, answer unread
  counts, lists and listens from the stream, and report itself healthy only
  while every gateway session and NATS are connected.
background:
  current-design: >-
    No service exists. The discord-forum-post-and-gateway-reply spike showed
    disgo v0.20.0 creating a forum post whose starter message held text, a
    persona embed, a button and a poll, a thread started from a text channel
    message, gateway
    delivery of replies in about 200 ms, and the gateway delivering a new
    post's starter message before the REST call that created the post
    returned.
  problems:
    - Activity must reach JetStream for touched threads only, and a thread's
      identifier is unknown until Discord answers the call that creates it.
    - Component interactions must be acknowledged within three seconds, long
      before any agent could answer.
    - Every client command asks for an unread count, which must not cost a
      Discord call per thread.
    - The service is a container with no volume; what it must remember lives
      in NATS.
design-challenges:
  events-before-registration: >-
    The gateway can deliver an event for a thread before deck knows the thread
    is touched, and can deliver deck's own message before the REST call that
    sent it returns. Three rules settle them. First, the service records the
    snowflake of every message it sends as soon as Discord answers, before it
    registers a thread or publishes, and keeps it for 10 minutes; a gateway
    copy of a recorded message is never published, because the REST path
    publishes it with `sent_by` and nonce. Second, a reply's gateway copy that
    arrives before Discord's answer is recognised by its nonce: the service
    sends Discord a nonce for each reply and text channel post, records it
    with the send's key before the call, and a message sent with a nonce
    carries it back on its gateway event (measured by
    discord-forum-post-and-gateway-reply), so that copy is published with the
    send's key and client nonce, the same event the REST path publishes, and
    whichever reaches JetStream first stands. A text channel post's message
    lives in the parent channel, outside every thread, so only the REST path
    publishes it. Third, a settling buffer holds every event in a thread
    channel (types 10, 11 and 12) that is not registered and whose snowflake
    is less than 10 seconds old; events in other channels are never held. A
    hold ends when the thread registers, and the held events then pass the two
    rules above, so a forum post's starter, which carries no nonce (measured),
    is dropped as the service's own and the REST path's copy stands. After 10
    seconds a held event whose thread is still not registered is dropped. The
    buffer holds at most 10,000 events and drops the oldest beyond that, with
    a log line. Held events reach the stream after events with greater
    snowflakes, which is why cursors follow stream positions.
  acknowledgement-deadline: >-
    The handler for a component interaction responds with a deferred message
    update (interaction response type 6) before it does anything else, and
    then publishes. It acknowledges every component interaction on a deck bot,
    touched thread or not, so nobody sees "This interaction failed" on a deck
    message.
  gateway-gaps: >-
    disgo resumes a dropped gateway session, and Discord replays the events
    missed while resuming. When a session cannot resume and a new one starts,
    or the service was not running, events in between are lost, and recovery
    reads the messages among them back from Discord. In the READY handler,
    before it handles any later event of that session (disgo dispatches a
    session's events in order), the service snapshots each of the bot's
    registered threads' boundary, the registry entry's last_message_id, and
    the bot's heartbeat, so live traffic moves neither. Recovery for that
    session starts when disgo reports every server of the session ready
    (GuildsReady, after each GUILD_CREATE) and the activity index has
    replayed, and finishes when every thread it visits is done. The threads to
    visit are the registered ones GUILD_CREATE listed as active with a
    last_message_id beyond their boundary, and the registered ones archived
    since the cutoff: for each parent channel holding registered threads of
    the bot, the service lists public archived threads and joined private
    archived threads, newest archive first, until their archive_timestamp is
    older than the cutoff. The cutoff is the snapshotted heartbeat minus one
    minute, or, when the bot has no heartbeat, the earliest touch among those
    threads' registry entries. A thread that got a reply and archived again
    while deck was down is found that way. For each thread it reads the
    messages after the boundary from Discord, 100 per request, publishes each
    one the index does not hold, and only then raises the entry's
    last_message_id; while a thread's recovery is pending, live publishes do
    not raise it. The heartbeat is written only once the session's recovery
    has finished, so a crash during recovery leaves both the boundaries and
    the cutoff where they were. A thread Discord reports as deleted (code
    10003) leaves the registry; one the bot can no longer read (code 50001) is
    logged and kept, and counts as done. Component uses and poll votes in the
    gap, and a poll result posted in a text channel for a post's starter,
    cannot be recovered; the risk gateway-gap-loses-interactions covers them.
  cheap-unread: >-
    Unread counts come from an in-memory activity index that follows the event
    stream, so a count costs no Discord or NATS request, whatever the cursor.
    Unread covers what the stream holds; a cursor older than the stream's
    oldest message is answered with horizon_passed, and the client reads what
    fell out with ListHistory.
  overlapping-bots: >-
    Several of deck's bots can be in one server and see one thread. A touched
    thread has one bot, recorded in its registry entry, and only that bot's
    gateway session publishes the thread's events; the others drop them, so
    each activity has one publisher. A call on a touched thread goes through
    the grant check against that bot: a key with no grant covering the thread
    through it is refused with PERMISSION_DENIED, and a key with one that
    named another bot gets INVALID_ARGUMENT naming the thread's bot. Keys
    share a thread through grants on its bot. Every bot acknowledges every
    component interaction it receives, and publishes it only when the
    interaction's thread is registered to that bot. A thread whose registry
    bot is no longer configured is outside every grant, since grants name
    configured bots only: calls on it are PERMISSION_DENIED and counts answer
    NOT_GRANTED. A thread its bot can no longer see produces no events, and
    calls that need Discord are PERMISSION_DENIED, while counts still answer
    from the index. Either entry stays until it expires or the operator
    deletes `threads.<thread snowflake>` from the bucket, after which the next
    touch registers the thread with the touching bot.
  partial-sends: >-
    A send can fail after Discord acted on it, and a client can repeat a send
    whose outcome it did not learn. Every Post and Reply carries the client's
    nonce, and the service keeps each key's sends by nonce from the start of a
    send until 10 minutes after it ends. A send has one owner, the first call:
    a repeat while it runs waits for it and returns its outcome, a repeat of a
    success returns that result without sending, and a repeat of a failure
    runs again. Once the service has called Discord, the send runs to its end
    whatever happens to the client's call. The nonce the service gives Discord
    is the first 25 characters of the base32 SHA-256 of `<key name>:<client
    nonce>`, so two keys' nonces never meet in Discord. A reply or text
    channel post sent again with that nonce and enforce_nonce returns the
    first message (measured), and starting a text channel post's thread on a
    message that already has one fails with code 160004 (measured), on which
    the service takes that thread; it deletes the message only when the thread
    fails for another reason. When Discord's answer to a forum post is lost,
    the service looks for the post among the server's active threads: a thread
    whose parent is the forum, whose owner is the bot, whose name is the title
    and whose snowflake is later than the send's start is the post; with none,
    the send failed. After a service restart, a repeat whose client nonce the
    activity index holds for that key returns that message and its thread; a
    forum post that Discord created and whose service died before publishing
    it can be created again, as the risk send-outcome-lost-in-a-service-crash
    records. Post reads the registry bucket's status before it calls Discord
    and returns UNAVAILABLE without posting when the bucket cannot be reached;
    once Discord answers, it registers the thread in memory at once and writes
    the entry within the call's deadline, and the call succeeds whether or not
    that write has landed: the service keeps retrying it in the background and
    logs a registration still unwritten when the service stops as lost. Reply
    writes the key into the entry before it sends, and returns UNAVAILABLE
    without sending when that write fails. A key absent from the entry is
    written `pending` and marked `sent` when its send succeeds; a key already
    `sent` stays `sent` through later replies. Both states count as touched.
    When a send fails, the service removes the key only if it is still
    `pending` and no other send by that key into that thread is in flight, and
    removes an entry left with no keys that deck did not create, so a failed
    attempt touches nothing and a concurrent success is never undone. After
    recovery at start, a `pending` key with no message from that key in the
    thread's index entries is removed the same way, so a crash leaves no
    orphan; a client that repeats the lost reply with its nonce touches the
    thread again.
proposed-design:
  high-level-overview: >-
    One process holds: one disgo client per bot; one NATS connection with a
    JetStream publisher, the thread registry (a key-value bucket mirrored in
    memory) and the activity index (an ordered, headers-only consumer of the
    stream mirrored in memory); the SSH and gRPC server of the transport
    design; and the HTTP healthcheck. Gateway events flow from a bot through
    the touched-thread filter and the settling buffer to the publisher; API
    calls go to Discord's REST API through the bot's client and read activity
    from the index and the stream.
  startup-and-shutdown: >-
    Start: load and validate the configuration; open the OpenBao or Vault
    client and read the host key, the NATS credentials and every bot token;
    connect to NATS; create or check the stream and the bucket as `manage`
    says; load the registry and start watching it; start the index's replay;
    open every bot's gateway session; open the SSH listener and the health
    listener. A failure before the listeners open exits with status 1 and a
    log line naming the step and the configuration path involved. API calls
    that read the index wait for its replay to reach the stream's last
    sequence at start, up to the call's deadline. SIGTERM or SIGINT closes the
    SSH listener, ends open calls, closes the gateway sessions, drains NATS and
    exits 0, within 10 seconds.
  bots: >-
    Each bot is a `bot.Client` from `disgo.New` with gateway intents guilds,
    guild messages, message content and guild message polls, and caches for
    guilds, channels, threads and members it sees. Its listeners handle guild
    MESSAGE_CREATE, INTERACTION_CREATE for components, MESSAGE_POLL_VOTE_ADD
    and MESSAGE_POLL_VOTE_REMOVE, READY and GUILD_CREATE, and ignore direct
    messages. A bot's token lives only inside its client. The bot registry
    maps bot names to clients and is the only path to Discord.
  thread-registry: >-
    The bucket `nats.threads.bucket` holds, with history 1, one entry per
    touched thread under `threads.<thread snowflake>`, one heartbeat per bot
    under `bots.<bot name>`, and the stream's epoch under `stream.epoch`. A
    thread entry, which expires after `nats.threads.max_age` without a write
    when that is set, is JSON: `bot` (the thread's one bot), `server_id`,
    `channel_id` (the parent), `created_by_deck`, `keys` (a map from key name
    to `{"touched_at": <RFC 3339>, "state": "pending" | "sent"}`), and
    `last_message_id`, the newest message the service published for the
    thread, set at registration to the post's or reply's own message and
    raised as the service publishes, at most once a second per thread and on a
    clean stop. A heartbeat is `{"seen_at": <RFC 3339>}`, written every 60
    seconds while the bot's gateway session is Ready and its recovery has
    finished. Writes use the entry's revision, so concurrent writers retry; a
    writer whose retry finds the thread registered to another bot applies the
    routing rule of overlapping-bots instead of writing. The service loads
    every entry at start and watches the bucket, and its in-memory map is what
    the gateway filter, routing and the grant checks read; sends by nonce and
    the count of sends in flight per key and thread, used by partial-sends,
    live only in memory.
  posting: >-
    Post checks the channel in the grant order the gRPC API specifies, taking
    the channel's server from the bot's Discord metadata, and refuses a type
    other than 0, 5, 15 or 16 with FAILED_PRECONDITION. It handles the nonce
    and the registry bucket's status as partial-sends describes. It builds a
    `discord.MessageCreate`: mentions become `<@id>` and `<@&id>` tokens at
    the start of the content and the only entries of allowed_mentions, with
    `parse` empty and replied_user false; with a persona, the text becomes the
    description of a leading embed whose author is the persona and the content
    holds only the mentions; embeds and components decode from their Struct
    JSON into disgo's types, and a component list with a type of 9 or above
    sets the IS_COMPONENTS_V2 flag (1 << 15) and requires empty text, embeds,
    poll and persona, its mention fields then setting allowed_mentions for
    tokens in its text displays; files become `discord.File` values. In a
    forum or media channel it calls CreatePostInThreadChannel with the title
    and tags, resolving tag names to the channel's available tags and
    requiring one when the channel's REQUIRE_TAG flag is set (INVALID_ARGUMENT
    without one). In a text or announcement channel it sends the message with
    the send's Discord nonce and enforce_nonce, then starts a thread from it
    with the title, taking the existing thread on code 160004 as partial-sends
    describes. Discord's error 50013 becomes FAILED_PRECONDITION naming the
    missing permission. It then registers the thread, publishes the first
    message from the REST response with `sent_by` and `nonce` set, waits for
    JetStream's acknowledgement within the call's deadline, and returns the
    thread, the message and a position: the message's own when acknowledged,
    otherwise the index's newest, while the publisher keeps retrying.
  replying: >-
    Reply checks the thread in the grant order the gRPC API specifies. A
    touched thread's bot, server and parent come from the registry, and the
    grant check runs against that bot before the reference's bot is compared,
    so a key not granted the thread through its bot gets PERMISSION_DENIED and
    only a granted key that named another bot gets INVALID_ARGUMENT. A thread
    not touched takes its server and parent from the named or only bot's
    Discord metadata (cache, or REST GetChannel). Reply refuses a channel that
    is not a thread (type 10, 11 or 12) and a locked thread, handles the nonce
    and the key's `pending` entry as partial-sends describes (registering the
    thread with this bot when it is not touched), sends the message built as
    for a post with the send's Discord nonce and enforce_nonce and a message
    reference when `reply_to_message_id` is set, marks the key `sent`, and
    publishes the message from the REST response with `sent_by` and `nonce`
    set, returning a position as a post does. Discord unarchives an archived
    thread when the message arrives.
  publishing: >-
    The publisher turns each activity into an event as the events
    specification defines (subject, headers, protojson payload) and publishes
    it with a JetStream acknowledgement. A failed publish is retried with
    backoff from 100 ms to 5 s for as long as the stream's duplicate window,
    then logged with the activity's kind and snowflake and dropped. A bot's
    gateway events are published only for threads registered to that bot, only
    when not held, and after routing: an event in a channel that is not a
    thread, about a message whose snowflake is a registered thread whose
    parent is that channel (a poll vote or component use on the message, or a
    poll result whose message reference is the message), belongs to that
    thread, since a thread started from a message has the message's snowflake.
    A message whose Discord nonce is one of the service's recorded sends is
    published with that send's key and client nonce. A poll vote's snowflake
    is `(milliseconds since 2015-01-01T00:00:00Z) << 22` plus a per-process
    counter modulo 2^22, taken when the vote arrives. The author of a poll
    vote carries the username when the bot's member cache has it and only the
    snowflake otherwise.
  activity-index: >-
    An ordered consumer with headers only and deliver policy all follows
    `<prefix>.>` from the stream's first message and stays live. For each
    event it records, under the thread from the subject: the activity's
    snowflake, kind, message type, `sent_by` and nonce from the headers, and
    the stream sequence and timestamp from the message's metadata. Entries per
    thread stay in sequence order, and entries older than the stream's maximum
    age are pruned every minute. The index also holds the stream's epoch and
    its first and last sequence. The epoch is a counter in the registry bucket
    under `stream.epoch`, `{"epoch": <n>, "created": <the stream's creation
    time>}`: whenever the service finds that the stream it follows has another
    creation time than the one recorded, because the stream was recreated or
    restored, it raises the epoch by one with a revision-checked write, so
    epochs only grow and every stream gets a new one. The index reads the
    stream's information at start and whenever its consumer ends, which
    deleting, recreating or restoring the stream causes; when the epoch has
    changed it discards its entries and replays the stream, and until that
    replay ends, calls that read the index wait up to their deadline and then
    return UNAVAILABLE, so no response pairs an epoch with another stream's
    sequences. The index is the only source of unread counts, lists and
    listens, and every instance of the service that follows the stream holds
    the same index.
  unread: >-
    CountUnread, for each cursor whose thread the calling key touched and
    whose parent is granted, takes the thread's index entries after the
    cursor: those with a greater sequence when the cursor's epoch is the
    stream's, and all of them otherwise. It counts the ones that are not
    messages of a type other than 0, 19 or 46, lists among them the messages
    whose `sent_by` is the calling key with their nonces, and sets
    horizon_passed when the cursor's epoch is not the stream's or the cursor's
    sequence is below the stream's first sequence minus one. It reads no
    Discord and no stream message. ListUnread takes the same entries in
    sequence order up to the limit, reads each event body from the stream by
    sequence, and refreshes attachment URLs: for a thread whose listed
    messages carry attachments it reads the thread's messages from Discord
    after the snowflake one less than the oldest of them, 100 per request,
    within the call's deadline, and takes their URLs, keeping the published
    URLs for any it did not reach; a text channel post's starter message,
    which lives in the parent channel, is read there by its snowflake. Listen
    registers a waiter on its threads in
    the index, answers at once with the states and current unread activity,
    and then streams each new entry that counts. Responses carry the stream's
    epoch.
  history: >-
    ListHistory checks the thread in the grant order the gRPC API specifies,
    reads Discord's messages with the given cursor and limit through the
    thread's bot, and returns them oldest first as Activity values, with
    `sent_by` and nonce for messages the index holds with them. For a thread
    started from a message in a text or announcement channel, the thread's
    first message in Discord is a starter reference (type 21); ListHistory
    returns in its place the starter message itself, read from the parent
    channel under the thread's snowflake, whenever the requested range reaches
    the start of the thread. It neither touches the thread nor reads the
    stream otherwise.
  channels: >-
    ListChannels walks each grant of the calling key, takes the server's
    channels from the bot's cache, and returns those of types 0, 5, 15 and 16
    that the grant covers, with the server's name and each forum's tags.
  healthcheck: >-
    The health listener serves `GET /livez`, 200 while the process runs, and
    `GET /healthz`, 200 when every bot's gateway status is Ready, the NATS
    connection is CONNECTED, and the activity index has finished its replay;
    otherwise 503. Both bodies are JSON: `{"status": "ok"}` or `{"status":
    "fail", "bots": {"helper": "disconnected"}, "nats": "reconnecting",
    "index": "replaying"}`, naming every check. A gateway session that is
    reconnecting or resuming counts as disconnected. The container image runs
    `deck service health` as its HEALTHCHECK, every 10 seconds with 3
    retries and a 60-second start period, which covers the index's headers-only
    replay of the stream.
  logging: >-
    The service logs JSON lines to stderr with log/slog: start, stop, gateway
    state changes, NATS state changes, refused calls with the key name and the
    gRPC code, publish failures, and buffer overflow. A log line holds
    snowflakes, names and categories, never a token, a message's content, a
    file or a Discord response body. disgo's own logger is wired to the same
    handler at warning level.
  nats-permissions: >-
    The service's NATS user publishes on `<prefix>.>`; publishes and
    subscribes on `$KV.<bucket>.>` for the registry's writes and watch;
    publishes on `$JS.FC.>`, where the watch's ordered push consumer answers
    flow control; uses the JetStream API (`$JS.API.>`) for its stream, its
    consumers and the bucket's stream `KV_<bucket>` (create and update only
    when `manage` is true); and subscribes on its own inbox. Subscribers of
    events need no permission on the bucket.
  container: >-
    The image `ghcr.io/wyrd-company/deck` holds the static `deck` executable,
    runs as a non-root user, exposes the SSH and health ports, reads
    `/etc/deck/config.yml`, and has the entrypoint `deck service start` and
    the HEALTHCHECK above. It needs no volume. Each bot needs View Channel,
    Send Messages, Send Messages in Threads, Create Public Threads, Create
    Polls, Embed Links, Attach Files and Read Message History in every channel
    a grant names for it, and Mention Everyone where a client mentions a role
    that is not mentionable. A missing permission fails the call with
    FAILED_PRECONDITION naming it; a role mention without Mention Everyone is
    sent and does not notify, as Discord does.
  modules: >-
    `internal/service` wires the process and owns startup and shutdown.
    `internal/service/discord` owns the bot registry, the gateway listeners,
    the settling buffer, acknowledgement, backfill and the translation between
    disgo's types and Activity and Content. `internal/service/registry` owns the
    bucket and its in-memory mirror. `internal/service/activity` owns the
    publisher and the index. `internal/service/api` implements
    `deck.v1.DeckService` from these. `internal/service/health` serves the
    health listener.
