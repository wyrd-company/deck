$schema: https://refinery.systems/ontology/decision-record
relationships:
  contextualizes:
    - client
    - grpc-api
    - discord-conversations
description: >-
  Unread is per session, and session affinity is stored only on the client's
  machine. Read state could still be kept on the service, keyed by something
  the client sends, or on the client with the service only counting.
considered-options:
  "1": >-
    Cursors and the session's own message snowflakes in the client's store;
    every unread call sends them and the service counts.
  "2": >-
    Read state on the service, keyed by client key and an opaque session token
    the client derives from its identifiers.
  "3": >-
    Read state on the service per client key, shared by every session on that
    key.
decision-outcome:
  chosen-option: 1
  justification: >-
    The invariant keeps session affinity off the service, and an opaque session
    token in option 2 is affinity under another name. Option 3 lets one
    session's read hide activity from another session on the same machine.
    Option 1 costs one stream position per thread in each request and keeps
    the service free of per-session state.
  decisions:
    cursor-position: >-
      A cursor is a stream position, the stream's epoch and a sequence, and
      activity is after it by position. A snowflake cursor would skip activity
      the stream receives late: a message held in the settling buffer, a
      recovered message, or a poll vote stamped by the service's clock. The
      epoch is a counter the service raises whenever the stream is recreated
      or restored, so a new stream's positions are later than every position
      of the old one, and a cursor can always move on and never back.
    own-messages: >-
      A session's own messages are known by a nonce the client records before
      it sends. The service lists, within each count, the calling key's
      messages with their nonces, and the client takes away its session's.
      Excluding by snowflake or by position fails for a message that reaches
      the stream after its session read something newer, or before the sending
      command recorded its result; a nonce recorded first has neither race.
      Discord returns a message's nonce on its gateway event, so the service
      tags deck's own replies whichever copy it publishes first.
expected-outcomes:
  positive:
    - The service holds no session state of any kind.
    - Two sessions on one machine have independent read state.
  negative:
    - Read state does not follow a session to another machine.
    - Each unread call carries one cursor per thread of the session, and each
      count carries the key's own unread messages for the client to subtract.
