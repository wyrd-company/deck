$schema: https://refinery.systems/ontology/term
title: Cursor
description: >-
  A session's read position in one thread, kept in the client's local store:
  a position in the event stream, its epoch and sequence. Activity published
  at a later position is after the cursor, so activity that reaches the stream
  late is still unread. A post or a session's first reply starts the cursor at
  the position the service returns for that message. Reading without keeping
  unread moves it to the position of the last activity read, and it never
  moves to an earlier position.
terms:
  - activity
  - unread
