<text x="475" y="233" fill="#edf4ff" font-size="112" font-weight="bold" letter-spacing="-5">deck</text>
<text x="482" y="302" fill="#edf4ff" font-size="33">Discord conversations</text>
<text x="482" y="347" fill="#edf4ff" font-size="33">for agent sessions.</text>
<text x="482" y="410" fill="#9eafc8" font-size="21">Post a question. Read the reply.</text>
